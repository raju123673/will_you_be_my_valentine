<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Girlfriend baby?</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Pacifico&family=Quicksand:wght@300;400;600&family=Nunito:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <!-- Intro / Game Section -->
        <div id="game-section">
            <h1 class="title">Collect 10 Hearts for a Surprise! ❤️</h1>
            <canvas id="gameCanvas" width="800" height="600"></canvas>
            <div id="score-board">Score: <span id="score">0</span>/10</div>
            <p class="instructions">Use your mouse or touch to move the basket!</p>
        </div>

        <!-- Proposal Section (Hidden initially) -->
        <div id="proposal-section" class="hidden">
            <h1 class="proposal-text">Will you be my Girfriend baby? 🌹</h1>
            <div class="buttons">
                <button id="yes-btn">Yes! 🥰</button>
                <button id="no-btn">No 😢</button>
            </div>
            <div id="celebration" class="hidden">
                <h2>Yay! I love you! ❤️</h2>
                <p>Happy Proposal Day for us baby!</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>


</html>
